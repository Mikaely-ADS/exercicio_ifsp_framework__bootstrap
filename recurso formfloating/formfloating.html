<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>Formulário de vendas com o recurso floating</title>
    <link
      rel="stylesheet"
      href="./../bootstrap-5.3.8-dist/css/bootstrap.min.css"
    />
    <script src="./../bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

    <style>

    .informativo {
       color: rgb(169, 54, 54);
       margin: 0 20px; 

    }
    
    .titulo {    
        text-align: center;

    }

    .bg-conteudo{
        background-color: rgba(214, 166, 77, 0.852);
        border-radius: 15px;
        width: 850px;
        height: auto;
    }
    .meu_avatar{


    }


    </style>
    
</head>
<body> 

    <div class="d-flex justify-content-center"><img src="./rock-and-roll.png" class="meu_avatar"/></div>
    <h1 class="titulo"> Compre aqui seu ingresso para o show <b> P.O.D </b></h1><br/>
    <h3 class="informativo"> Atenção: Os ingressos não serão vendidos para menores de 16 anos. E esses, devem está acompanhados com um responsável maior de idade portando documentação.</h3> <br/>
    
    <div class="container bg-conteudo">
    <form action="post" class="form-floating">
        <label for="nome"> Seu nome:</label><br/>
        <input type="text" name="nome" id=""><br/>

        <label for="email"> E-mail: </label><br/>
        <input type="email" name="email" id=""><br/><br/>

        <input type="tel" placeholder="Informe seu contato"/><br/>
        <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addon1">@</span>
            <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
        </div>

        <label for="Camiseta_brinde"> Escolha a cor do seu brinde: </label><br/>
        <select name="Camiseta_brinde" id=""><br/>
            <option value="preta">preta</option>
            <option value="branco">branco</option>
            <option value="cinza">cinza</option>
            <option value="preta">preta</option>
        </select><br/>
    
        <label for="Setor"> Sua vista para o show: </label><br/>
        <select name="Setor" id="Setor" class="form-select-sm">  
            <option value="Setor zona 1">Setor zona 1</option>
            <option value="Pista">Pista</option>
            <option value="Front">Front</option>
            <option value="Mesa vip">Mesa vip</option>
        </select><br/>

        <label for="carteirinha">Envie sua foto para a carteirinha</label><br/>
        <input type="file" accept="image/*"> <br/>
        <input type="submit" />
        <button> limpar </button>

        
    </form>
    </div>
    

</body>
</html>




    </div>
  </body>
</html>
