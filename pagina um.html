<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página de vendas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="mb-4">Venda de Ingressos</h1>

      <form>
        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control"
            id="nome"
            placeholder="Nome completo"
          />
          <label for="nome">Nome completo</label>
        </div>

        <div class="form-floating mb-3">
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="nome@email.com"
          />
          <label for="email">E-mail</label>
        </div>

        <div class="form-floating mb-3">
          <select
            class="form-select"
            id="evento"
            aria-label="Selecione o evento"
          >
            <option selected>Selecione um evento</option>
            <option value="1">Show de Rock</option>
            <option value="2">Festival Sertanejo</option>
            <option value="3">Peça de Teatro</option>
          </select>
          <label for="evento">Evento</label>
        </div>

        <div class="mb-3">
          <label for="quantidade" class="form-label"
            >Quantidade de ingressos</label
          >
          <input
            type="number"
            class="form-control"
            id="quantidade"
            min="1"
            placeholder="Digite a quantidade"
          />
        </div>

        <div class="mb-3">
          <label for="valor" class="form-label">Valor do ingresso</label>
          <div class="input-group">
            <span class="input-group-text">R$</span>
            <input
              type="number"
              class="form-control"
              id="valor"
              placeholder="0,00"
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Comprar ingresso</button>
      </form>
    </div>
    <div class="container mt-5">
      <h2 class="mb-4">Status dos eventos</h2>
      <span class="badge bg-primary">Novo</span>
      <span class="badge bg-success">Disponível</span>
      <span class="badge bg-danger">Esgotado</span>
      <span class="badge bg-warning text-dark">Atenção</span>
      <span class="badge bg-secondary">Inativo</span>
    </div>

    <div class="container mt-5">
      <h5>Pista Premium <span class="badge bg-danger">Quase Esgotado</span></h5>
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDois">
          Detalhes do Local
        </button>
      </h2>
      <div id="collapseDois" class="accordion-collapse collapse" data-bs-parent="#accordionExemplo">
        <div class="accordion-body">
          Estádio Nacional, 20h.
<div
      class="accordion"
      id="meuAccordion"
      style="max-width: 500px; margin: 10px auto"
    >
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button
            class="accordion-button"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#item1"
          >
            Selecione o show
          </button>
        </h2>

        <div
          id="item1"
          class="accordion-collapse collapse show"
          data-bs-parent="#meuAccordion"
        ></div>
          <div class="accordion-body">Show de rock com POO</div>
        </div>
    
    </div>

    
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
